# Lint/format gates only. Tests stay in CI.
# After clone: uv sync && uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with ruff pin in pyproject.toml
    rev: v0.15.20
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
