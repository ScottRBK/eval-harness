# Broken Nginx configuration — the agent must repair this to meet the task
# requirements.  This file is full of deliberate defects.

worker_processes auto;

pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Temp paths default to locations owned by root — inaccessible when
    # running as the `node` user.  This is one of the defects to fix.
    client_body_temp_path client_body_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;

    # No custom log format is defined (required: method, status, user agent).
    access_log /var/log/nginx/access.log;

    server {
        # Wrong port — should be 8080.
        listen 80;

        # No root directive — static content at /srv/site is not served.
        # No /health endpoint.
        # No custom 404 page.
        # No try_files or index directive.

        location / {
            return 200 "broken\n";
        }
    }
}